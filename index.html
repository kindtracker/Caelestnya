<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Caelestnya</title>
    <link href="CatMacchiato.css" rel="stylesheet">
    <link href="Style.css" rel="stylesheet">
  </head>
  <body>
    <div class="ToolBar">
      <button class="ToolBarButton" title="Cursor">
        <img src="RobloxIcons/Cursor.png">
      </button>

      <button class="ToolBarButton" title="Move">
        <img src="RobloxIcons/Move.png">
      </button>

      <button class="ToolBarButton" title="Resize">
        <img src="RobloxIcons/Resize.png">
      </button>

      <button class="ToolBarButton" title="Rotate">
        <img src="RobloxIcons/Rotate.png">
      </button>
    </div>

    <div class="Explorer">
      <div class="ExplorerSearch">
        <input
          class="ExplorerSearchInput"
          type="search"
          placeholder="Filter instances..."
        >
      </div>
    </div>

    <script src="Main.js"></script>
  </body>
</html>
