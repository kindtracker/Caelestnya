<!DOCTYPE html>
<html data-theme="macchiato" lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nyra</title>
    <link href="/Style/Catppuccin.css" rel="stylesheet">
    <link href="/Style/Style.css" rel="stylesheet">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >
  </head>
  <body>
    <div class="ToolBar">
      <div class="PanelDragHandle" title="Drag toolbar">⠿</div>

      <button class="ToolBarButton active" title="Cursor">
        <img src="/RobloxIcons/Cursor.png">
      </button>

      <button class="ToolBarButton" title="Move">
        <img src="/RobloxIcons/Move.png">
      </button>

      <button class="ToolBarButton" title="Resize">
        <img src="/RobloxIcons/Resize.png">
      </button>

      <button class="ToolBarButton" title="Rotate">
        <img src="/RobloxIcons/Rotate.png">
      </button>

      <div class="ToolBarSeparator"></div>

      <label class="ToolBarValue" title="Move increment">
        <img src="/RobloxIcons/Move.png" alt="">
        <input type="number" value="1" min="0" step="1">
        <span>Units</span>
      </label>

      <label class="ToolBarValue" title="Rotation increment">
        <img src="/RobloxIcons/Rotate.png" alt="">
        <input type="number" value="45" min="0" max="360" step="45">
        <span>Degrees</span>
      </label>

      <div class="ToolBarRight">
        <button class="ToolBarButton" title="Run">
          <i class="fa-solid fa-play active"></i>
        </button>

        <button class="ToolBarButton" title="Pause">
          <i class="fa-solid fa-pause"></i>
        </button>

        <button class="ToolBarButton" title="Stop">
          <i class="fa-solid fa-square"></i>
        </button>

        <img class="ProfilePicture" src=""></img>
        <span stlyle="cursor: default;">kindtracker</span>
      </div>
    </div>

    <div class="Explorer">
      <div class="PanelTitleBar">
        <div class="PanelDragHandle" title="Drag Explorer">⠿</div>
        <span class="PanelTitleItem active">
          Explorer
        </span>

        <span class="PanelTitleItem">
          Toolbox
        </span>
      </div>

      <div class="SearchBar">
        <input
          class="SearchBarInput"
          type="search"
          placeholder="Filter instances..."
        >
      </div>
 
      <canvas tabindex="0" id="ExplorerCanvas"></canvas>
    </div>

    <div class="Properties">
      <div class="PanelTitleBar">
        <div class="PanelDragHandle" title="Drag Properties">⠿</div>
        <span class="PanelTitleItem active">Properties</span>
      </div>

      <div class="SearchBar">
        <input
          class="SearchBarInput"
          type="search"
          placeholder="Filter properties..."
        >
      </div>

      <div class="PropertiesTable">
        <div class="PropertyEmpty">Select an instance to view its properties.</div>
        <img title="Car" class="Car" src="https://cataas.com/cat"></img>
      </div>
    </div>

    <div class="Game">
      <div class="PanelTitleBar">
        <div class="PanelDragHandle" title="Drag Game">⠿</div>
        <span class="PanelTitleItem active">
          Faculty
        </span>

        <span class="PanelTitleItem">
          LocalScript
        </span>
      </div>
    </div>

    <div class="BottomPart">
      <div class="PanelTitleBar">
        <div class="PanelDragHandle" title="Drag Console">⠿</div>
        <span class="PanelTitleItem active">Console</span>
        <span class="PanelTitleItem">Asset Manager</span>
        <span class="PanelTitleItem">Animator</span>
      </div>

      <div class="SearchBar">
        <button class="SearchBarButton" title="Clear logs">
          <i class="fa-solid fa-eraser"></i>
        </button>

        <input
          class="SearchBarInput"
          type="search"
          placeholder="Filter messages..."
        >
      </div>

      <div class="ConsoleConfiguration">
        <div class="ConsoleConfig">
          <input
            class="ConsoleConfigCheckBox"
            type="checkbox"
          >
          <span>All</span>
        </div>

        <span class="ConsoleSeparator">Context</span>

        <div class="ConsoleConfig">
          <input
            class="ConsoleConfigCheckBox"
            type="checkbox"
          >
          <span>User</span>
        </div>

        <div class="ConsoleConfig">
          <input
            class="ConsoleConfigCheckBox"
            type="checkbox"
          >
          <span>Nya</span>
        </div>

        <span class="ConsoleSeparator">Severity</span>

        <div class="ConsoleConfig">
          <input
            class="ConsoleConfigCheckBox Info"
            type="checkbox"
          >
          <span>Info</span>
        </div>

        <div class="ConsoleConfig">
          <input
            class="ConsoleConfigCheckBox Warning"
            type="checkbox"
          >
          <span>Warning</span>
        </div>

        <div class="ConsoleConfig">
          <input
            class="ConsoleConfigCheckBox Error"
            type="checkbox"
          >
          <span>Error</span>
        </div>
      </div>

      <div class="ConsoleOutput"></div>
    </div>

    <div id="CreateList" class="ContextList" hidden>
      <button class="ContextListItem" data-class="Part">Part</button>
      <button class="ContextListItem" data-class="Folder">Folder</button>
      <button class="ContextListItem" data-class="Script">Script</button>
    </div>

    <div id="ContextMenu" class="ContextList" hidden>
      <button class="ContextListItem">Cut</button>
      <button class="ContextListItem">Copy</button>
      <button class="ContextListItem">Paste</button>
      <button class="ContextListItem">Duplicate</button>
      <button class="ContextListItem">Delete</button>
    </div>

    <script src="/Javascript/Explorer.js"></script>
    <script src="/Javascript/Panel.js"></script>
    <script src="/Javascript/Properties.js"></script>
    <script src="/Javascript/ToolBar.js"></script>
  </body>
</html>
